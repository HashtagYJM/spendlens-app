    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SpendLens</title>
    <!--
      No external stylesheets, no CDN, no third-party resources.
      CLAUDE.md §2.1: local-first, no network calls at runtime.

      PWA installability (browser build only — irrelevant inside Tauri, but
      harmless there too): manifest + icons make "Add to Home Screen" work;
      Home-Screen install is what exempts OPFS storage from WebKit's 7-day
      inactive-tab eviction (docs/specs/browser-parsing-feasibility.md §3).
    -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#F7F3EC" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SpendLens" />
    <script type="module" crossorigin src="./assets/index-us8vz6UH.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-iWxAUisC.css">
  </head>
